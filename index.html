<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HarfBuzz Trace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>HarfBuzz Trace</h1>
      <span id="hb-version" class="version-badge"></span>
      <label class="hb-select-label" for="hb-version-select">Engine</label>
      <select id="hb-version-select" title="Choose the harfbuzzjs build (HarfBuzz version) used for shaping" disabled></select>
    </header>

    <section id="font-drop-zone" class="drop-zone" role="button" tabindex="0" aria-label="Drop TTF font file here">
      <span class="drop-label">drop TTF font here</span>
      <span id="font-name" class="font-name"></span>
      <span id="font-meta" class="font-meta"></span>
      <input type="file" id="font-file-input" accept=".ttf,.otf" hidden>
    </section>

    <section id="controls" class="controls-row">
      <div class="control-group">
        <label for="word-input">Word</label>
        <input type="text" id="word-input" placeholder="type word…" autocomplete="off" spellcheck="false">
        <button id="shape-btn" title="Shape (Enter)">Shape</button>
      </div>
      <div class="control-group">
        <label for="script-input">Script</label>
        <input type="text" id="script-input" value="" size="6" placeholder="auto" autocomplete="off" spellcheck="false">
      </div>
      <div class="control-group">
        <label for="lang-input">Language</label>
        <input type="text" id="lang-input" value="" size="6" placeholder="auto" autocomplete="off" spellcheck="false">
      </div>
      <div class="control-group">
        <label>Direction</label>
        <div class="radio-group" id="direction-group">
          <label class="radio-label"><input type="radio" name="direction" value="auto" checked> Auto</label>
          <label class="radio-label"><input type="radio" name="direction" value="ltr"> LTR</label>
          <label class="radio-label"><input type="radio" name="direction" value="rtl"> RTL</label>
        </div>
      </div>
      <div class="control-group">
        <label for="table-filter">Tables</label>
        <select id="table-filter">
          <option value="both">GSUB + GPOS</option>
          <option value="GSUB">GSUB only</option>
          <option value="GPOS">GPOS only</option>
        </select>
      </div>
    </section>

    <section id="codepoints-row" class="codepoints-row">
      <label class="codepoints-label" for="hex-input">Hex</label>
      <div class="hex-wrap">
        <div id="hex-backdrop" class="hex-backdrop" aria-hidden="true"></div>
        <input type="text" id="hex-input" placeholder="61 62 fba80 …" title="Hex code points, delimited by any non-hex character; U+ and \u are ignored" autocomplete="off" spellcheck="false">
      </div>
    </section>

    <section id="cp-strip" class="cp-strip" aria-label="Source code points (hover to cross-reference with the trace)" hidden></section>

    <section id="output-area">
      <div id="trace-container">
        <div id="trace-empty" class="trace-empty">no trace — load a font and type a word</div>
        <div id="trace-list" class="trace-list" hidden></div>
      </div>

      <div class="right-panel">
        <div id="hover-grid" class="hover-grid" hidden>
          <table id="hover-table" class="hg-table">
            <thead>
              <tr>
                <th>#</th>
                <th>glyph</th>
                <th class="hg-name">name</th>
                <th>cl</th>
                <th class="hg-src">src</th>
                <th>ax</th>
                <th>ay</th>
                <th>dx</th>
                <th>dy</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div id="svg-panel" class="svg-panel" hidden></div>
      </div>
    </section>
  </div>

  <script type="module" src="js/main.mjs"></script>
</body>
</html>
